[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -ra
markers =
    unit: Fast unit tests for fixtures, hashing, and schema validations
    integration: Integration tests for IPFS, Fabric ledger adapters, and audit trails
    security: Security audit tests for RBAC, JWT tampering, and unauthorized access
    consent: Consent lifecycle, revocation enforcement, and policy tests
    audit: Audit trail completeness and non-repudiation tests
